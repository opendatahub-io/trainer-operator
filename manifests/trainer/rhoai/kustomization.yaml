# RHOAI configuration for Kubeflow Training Operator (KFTO)

# Adds namespace to all resources.
namespace: opendatahub

sortOptions:
  order: legacy

configMapGenerator:
- name: rhoai-config
  envs:
    - params.env

configurations:
- params.yaml

replacements:
# Replace NAMESPACE placeholder in ServiceMonitor serverName with the operator namespace
- source:
    kind: ConfigMap
    name: rhoai-config
    version: v1
    fieldPath: data.operator-namespace
  targets:
  - select:
      kind: ServiceMonitor
      name: kubeflow-trainer-controller-manager-metrics-monitor
    fieldPaths:
    - spec.endpoints.0.tlsConfig.serverName
    options:
      delimiter: "."
      index: 1
# Replace controller image
- source:
    kind: ConfigMap
    name: rhoai-config
    version: v1
    fieldPath: data.odh-kubeflow-trainer-controller-image
  targets:
  - select:
      kind: Deployment
      name: kubeflow-trainer-controller-manager
    fieldPaths:
    - spec.template.spec.containers.0.image

# Labels to add to all resources and selectors.
labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/component: controller
    app.kubernetes.io/name: trainer

resources:
- ../base/crds
- ../base/manager
- ../base/rbac
- ../base/webhook
# - ../third-party/jobset #uncomment if jobset should be bundled under kubeflow trainer controller manager
- kubeflow-training-roles.yaml
- monitor.yaml
- rbac/tls

secretGenerator:
  - name: kubeflow-trainer-webhook-cert
    options:
      disableNameSuffixHash: true

patches:
# Mount the controller config file for loading manager configurations
# through a ComponentConfig type
- path: manager_config_patch.yaml
- path: manager_metrics_patch.yaml
# Escape the Kubernetes-reserved CEL identifier used by the upstream CRDs.
- patch: |-
    - op: replace
      path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/template/properties/spec/properties/volumeClaimPolicies/items/x-kubernetes-validations/0/rule
      value: self.templates.all(t, !has(t.metadata.__namespace__) || size(t.metadata.__namespace__) == 0)
  target:
    group: apiextensions.k8s.io
    version: v1
    kind: CustomResourceDefinition
    name: clustertrainingruntimes.trainer.kubeflow.org
- patch: |-
    - op: replace
      path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/template/properties/spec/properties/volumeClaimPolicies/items/x-kubernetes-validations/0/rule
      value: self.templates.all(t, !has(t.metadata.__namespace__) || size(t.metadata.__namespace__) == 0)
  target:
    group: apiextensions.k8s.io
    version: v1
    kind: CustomResourceDefinition
    name: trainingruntimes.trainer.kubeflow.org
# RHAI-specific RBAC for progression tracking
- path: rbac_progression_patch.yaml
  target:
    group: rbac.authorization.k8s.io
    version: v1
    kind: ClusterRole
    name: kubeflow-trainer-controller-manager
- patch: |-
    - op: remove
      path: /spec/ports/0
  target:
    group: ""
    version: v1
    kind: Service
    name: kubeflow-trainer-controller-manager
