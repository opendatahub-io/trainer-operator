apiVersion: v1
kind: Service
metadata:
  name: controller-manager-metrics-service
  annotations:
    # OpenShift service-ca watches this annotation and writes
    # trainer-operator-metrics-tls. Do not deploy a ConfigMap named
    # openshift-service-ca.crt with inject-cabundle — the platform already
    # creates it; owning it loops.
    service.beta.openshift.io/serving-cert-secret-name: trainer-operator-metrics-tls
